name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  build:
    name: Build & QA
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: '28'
            rebar3: '3.25.1'
            elixir: '1.18.4-otp-28'
          - otp: '28'
            rebar3: '3.25.1'
            elixir: '1.19.6-otp-28'
          - otp: '29'
            rebar3: '3.27.0'
            elixir: '1.20.4-otp-29'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir/OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ matrix.rebar3 }}
          elixir-version: ${{ matrix.elixir }}

      - name: Restore dependencies and build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Run Credo
        run: mix credo --strict

      - name: Restore PLT cache
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Build PLT
        run: |
          mkdir -p priv/plts
          mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer --format github --format dialyxir
